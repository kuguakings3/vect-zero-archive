name: Deploy Vect Zero design archive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/vect-zero-archive.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/vect-zero-archive.js
      - name: Install isolated DOM test dependency
        run: npm install --prefix /tmp/vect-zero-test --no-save --no-package-lock jsdom@26
      - name: Run archive interaction smoke tests
        run: NODE_PATH=/tmp/vect-zero-test/node_modules node tests/smoke.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Verify published site
        run: |
          set -e
          for attempt in $(seq 1 12); do
            status=$(curl -sSL -o /tmp/vect-zero-live.html -w "%{http_code}" https://kuguakings3.github.io/vect-zero-archive/ || true)
            if [ "$status" = "200" ] && grep -q 'name="archive-build" content="2026-10-29-capacity-review-2"' /tmp/vect-zero-live.html && grep -q 'function capacityReview()' /tmp/vect-zero-live.html; then
              echo "Published site returned HTTP 200 and contains the current departure draft."
              exit 0
            fi
            echo "Waiting for the latest GitHub Pages content (attempt $attempt; HTTP $status)."
            sleep 5
          done
          echo "Published site did not return the expected current build." >&2
          exit 1
